name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    env:
      USE_BLAS: mkl
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyscf
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Install FCIpy
        run: |
          git clone https://github.com/kgururangan/fcipy.git fcipy
          pushd fcipy/fcipy/lib
          make -j2
          popd
          pip install -e fcipy

      - name: Install dsrg
        run: |
          pip install -e .

      - name: Test with pytest
        run: |
          pytest -v tests
